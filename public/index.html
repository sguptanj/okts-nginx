<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OKTS Demo</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:60px;
}

.card{
    width:500px;
    margin:auto;
    padding:30px;
    border-radius:12px;
    background:#1e293b;
}

h1{
    margin-bottom:20px;
}

#clock{
    font-size:48px;
    color:#4ade80;
}

.info{
    margin-top:20px;
    font-size:20px;
}

</style>

</head>

<body>

<div class="card">

<h1>OKTS Dynamic Demo</h1>

<div id="clock"></div>

<div class="info">
API Calls:
<span id="counter">0</span>
</div>

<div class="info">
Last Response:
<span id="status">Waiting...</span>
</div>

</div>

<script>

let count=0;

function updateClock(){

    document.getElementById("clock").innerHTML=
        new Date().toLocaleTimeString();

}

async function hitAPI(){

    try{

        const response=await fetch("/api/ping");

        const data=await response.json();

        count++;

        document.getElementById("counter").innerHTML=count;

        document.getElementById("status").innerHTML=
            data.timestamp;

    }
    catch(e){

        document.getElementById("status").innerHTML="API Failed";

    }

}

updateClock();

setInterval(updateClock,1000);

hitAPI();

setInterval(hitAPI,10000);

</script>

</body>
</html>
